[project]
name = "locqa"
version = "0.1.0"
description = "Localization QA for Flutter ARB files, Kazakh-first"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2.5",
    "typer>=0.12",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
locqa = "locqa.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/locqa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
